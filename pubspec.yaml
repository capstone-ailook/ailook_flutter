  uuid: ^4.5.3
  image_picker: ^1.2.1 # 갤러리 접근
  single_import_generator: ^1.0.0 # barrel file generator
  lorem_ipsum_generator: ^0.0.3 # 랜던 텍스트 generator(삭제 예정)
