name: ailook_flutter
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  flutter_svg: ^2.2.1
  flutter_easyloading: ^3.0.5 # 로딩 UI 처리 관련
  gap: ^3.0.1 # 간격 위젯

  # 상태관리
  hooks_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  flutter_hooks: ^0.21.2

  # DI
  get_it: ^8.2.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0

  # 라우팅
  go_router: ^16.3.0

  # Auth
  google_sign_in: ^6.2.1

  # Utils
  flutter_dotenv: ^6.0.0 # dotnev

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  go_router_builder: 2.7.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/fonts/
    - assets/fonts/pretendard/

  fonts:
    - family: pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 800