  korean_profanity_filter: ^1.0.0 # 비속어 욕설 필터링
  icons_launcher: ^3.0.3 # 앱 아이콘
  in_app_review: ^2.0.11 # 인앱 리뷰
  url_launcher: ^6.3.2 # url 런쳐
  easy_isolate_mixin: ^1.0.1 # Isolate
  flutter_local_notifications: ^21.0.0 # 로컬 푸시
  youtube_player_iframe: ^5.2.2 # 유튜브
  logger: ^2.7.0
  device_info_plus: ^12.3.0
  pod_player: ^0.2.2
  connectivity_plus: ^7.0.0 # 네트워크 연결 상태 관리합
  easy_localization: ^3.0.8 # 다국어 지원
  collection: ^1.19.1 # 콜렉션 타입 익스텐션 지원 메소드
  infinite_scroll_pagination: ^5.1.1 # 무한스크롤 페이지네이션
  extended_nested_scroll_view: ^6.2.1
  # 앱 정보
  package_info_plus: ^9.0.0 # 현재 앱 버전 정보
  pub_semver: ^2.2.0 # 주부수 버전 비교 연산
  transparent_image: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.13.0
  go_router_builder: ^4.2.0
  build_verify: ^3.1.1
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  retrofit_generator: ^10.2.1
  freezed: ^3.2.3
  analyzer: ^8.4.0
  hive_ce_generator: ^1.10.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/fonts/
    - assets/fonts/pretendard/

  fonts:
    - family: pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 800